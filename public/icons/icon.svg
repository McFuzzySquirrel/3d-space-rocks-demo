<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">3D Space Rocks app icon</title>
  <desc id="desc">A stylized orange spacecraft flying through a starfield.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="55%" stop-color="#091a35"/>
      <stop offset="100%" stop-color="#030714"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd087"/>
      <stop offset="50%" stop-color="#ff8e32"/>
      <stop offset="100%" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="thruster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4c4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff5a00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <g fill="#9bc7ff" opacity="0.9">
    <circle cx="88" cy="120" r="5"/>
