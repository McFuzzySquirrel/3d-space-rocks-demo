    <circle cx="188" cy="92" r="3"/>
    <circle cx="401" cy="117" r="5"/>
    <circle cx="350" cy="82" r="4"/>
    <circle cx="428" cy="214" r="3"/>
    <circle cx="116" cy="350" r="4"/>
    <circle cx="176" cy="408" r="3"/>
    <circle cx="380" cy="372" r="5"/>
    <circle cx="424" cy="316" r="4"/>
  </g>
  <g opacity="0.55">
    <path d="M376 130L168 338" stroke="#23426c" stroke-width="22" stroke-linecap="round"/>
    <path d="M418 172L212 378" stroke="#16355b" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g filter="url(#glow)">
    <path d="M140 332L66 400L182 374L244 436L286 390L238 340L312 264L250 202L140 332Z" fill="url(#thruster)"/>
